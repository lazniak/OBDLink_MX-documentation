<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="120" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="20" y1="30" x2="100" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="pulse" x1="40" y1="50" x2="80" y2="70" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="120" height="120" rx="24" fill="url(#bg)"/>
  
  <!-- Outer ring -->
  <circle cx="60" cy="56" r="36" stroke="url(#accent)" stroke-width="2.5" fill="none" opacity="0.6"/>
  
  <!-- Speed arc -->
  <path d="M 30 72 A 36 36 0 0 1 90 72" stroke="url(#accent)" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Needle -->
  <line x1="60" y1="56" x2="82" y2="38" stroke="url(#pulse)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Center dot -->
  <circle cx="60" cy="56" r="4" fill="url(#pulse)"/>
  <circle cx="60" cy="56" r="2" fill="#0F172A"/>
  
  <!-- Tick marks -->
  <line x1="30" y1="56" x2="34" y2="56" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="86" y1="56" x2="90" y2="56" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="60" y1="24" x2="60" y2="28" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="38" y1="32" x2="41" y2="35" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="82" y1="32" x2="79" y2="35" stroke="#64748B" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- RT label -->
  <text x="60" y="106" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" letter-spacing="3">
    <tspan fill="#3B82F6">R</tspan><tspan fill="#8B5CF6">T</tspan>
  </text>
</svg>
